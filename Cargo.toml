[package]
name = "zjstatus"
version = "0.25.0"
authors = ["Daniel Jankowski"]
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "zjstatus"
bench = false

[[bin]]
name = "zjframes"
bench = false

[lib]
bench = false

[features]
bench = []
tracing = []

[dependencies]
zellij-tile = "0.45.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
regex = "1.13.1"
chrono-tz = "0.10.4"
anyhow = "1.0.104"
anstyle = "1.0.14"
uuid = { version = "1.26.0", features = ["v4"] }
lazy_static = "1.5.0"
cached = { version = "4.0.0" }
console = "0.16.4"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
kdl = { version = "6.7.1", features = ["v1", "v1-fallback"] }
rstest = "0.26.1"
itertools = "0.15.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
    "html_reports",
] }

[[bench]]
name = "benches"
harness = false

[[bench]]
name = "widgets"
harness = false
