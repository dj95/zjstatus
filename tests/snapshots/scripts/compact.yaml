# compact bar from examples/compact.kdl.
# tab_update cannot set active_swap_layout_name, so this script sends TabUpdate
# as event_json. The active tab's layout name is vertical.
name: compact
plugin: ../../../target/wasm32-wasip1/release/zjstatus.wasm
geometry:
  rows: 1
  cols: 120
config:
  format_left: "#[fg=#FFFFFF,bold] {session} {mode} {tabs}"
  format_right: "#[bg=#8A8A8A,fg=#000000] #[bg=#8A8A8A,fg=#000000,bold]{swap_layout} #[bg=#000000,fg=#8A8A8A]"
  mode_locked: "#[fg=#FF00D9,bold] {name} "
  mode_normal: "#[fg=#AFFF00,bold] {name} "
  mode_resize: "#[fg=#D75F00,bold] {name} "
  mode_default_to_mode: "resize"
  tab_normal: "#[bg=#8A8A8A,fg=#000000] #[bg=#8A8A8A,fg=#000000,bold]{name} {sync_indicator}{fullscreen_indicator}{floating_indicator} #[bg=#000000,fg=#8A8A8A]"
  tab_active: "#[bg=#AFFF00,fg=#000000] #[bg=#AFFF00,fg=#000000,bold]{name} {sync_indicator}{fullscreen_indicator}{floating_indicator} #[bg=#000000,fg=#AFFF00]"
  tab_sync_indicator: " "
  tab_fullscreen_indicator: "□ "
  tab_floating_indicator: "󰉈 "
steps:
  - action: grant_permissions
  - action: mode_update
    mode: normal
    session: dev
  - action: event_json
    json: "{\"TabUpdate\":[{\"position\":0,\"name\":\"shell\",\"active\":true,\"panes_to_hide\":0,\"is_fullscreen_active\":false,\"is_sync_panes_active\":false,\"are_floating_panes_visible\":false,\"other_focused_clients\":[],\"active_swap_layout_name\":\"vertical\",\"is_swap_layout_dirty\":false,\"viewport_rows\":40,\"viewport_columns\":80,\"display_area_rows\":42,\"display_area_columns\":80,\"selectable_tiled_panes_count\":1,\"selectable_floating_panes_count\":0,\"tab_id\":0,\"has_bell_notification\":false,\"is_flashing_bell\":false},{\"position\":1,\"name\":\"nvim\",\"active\":false,\"panes_to_hide\":0,\"is_fullscreen_active\":false,\"is_sync_panes_active\":false,\"are_floating_panes_visible\":false,\"other_focused_clients\":[],\"active_swap_layout_name\":null,\"is_swap_layout_dirty\":false,\"viewport_rows\":40,\"viewport_columns\":80,\"display_area_rows\":42,\"display_area_columns\":80,\"selectable_tiled_panes_count\":1,\"selectable_floating_panes_count\":0,\"tab_id\":1,\"has_bell_notification\":false,\"is_flashing_bell\":false}]}"
