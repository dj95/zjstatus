    json: "{\"RunCommandResult\":[0,[27,91,48,109,27,91,51,56,59,50,59,50,52,59,50,52,59,51,55,109,27,91,52,56,59,50,59,49,50,50,59,49,54,56,59,49,53,57,109,238,130,184,50,100,27,91,51,56,59,50,59,49,50,50,59,49,54,56,59,49,53,57,109,27,91,52,56,59,50,59,49,53,50,59,49,56,55,59,49,48,56,109,238,130,184,27,91,51,56,59,50,59,48,59,48,59,48,109,27,91,52,56,59,50,59,49,53,50,59,49,56,55,59,49,48,56,109,52,50,37,32,49,56,71,27,91,51,56,59,50,59,49,53,50,59,49,56,55,59,49,48,56,109,27,91,52,56,59,50,59,49,50,54,59,49,53,54,59,50,49,54,109,238,130,184,27,91,51,56,59,50,59,48,59,48,59,48,109,27,91,52,56,59,50,59,49,50,54,59,49,53,54,59,50,49,54,109,48,46,51,49,27,91,51,56,59,50,59,49,50,54,59,49,53,54,59,50,49,54,109,27,91,52,56,59,50,59,49,53,54,59,49,51,52,59,49,57,49,109,238,130,184,27,91,51,56,59,50,59,48,59,48,59,48,109,27,91,52,56,59,50,59,49,53,54,59,49,51,52,59,49,57,49,109,54,49,37,32,49,54,71,32,243,176,129,185,56,48,37],[],{\"name\":\"command_conky\"}]}"
